# Builds the demo previews and deploys them to Cloudflare Pages on every push
# to the demo branch. The deploy runs on GitHub's servers with two repository
# secrets (GitHub: Settings > Secrets and variables > Actions > New repository secret):
#
#   CLOUDFLARE_API_TOKEN   Cloudflare dashboard > My Profile > API Tokens >
#                          Create Token > "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard > Workers & Pages (right sidebar)
#
# Until both secrets exist the job only builds the demos and skips the deploy.
# The site lands at https://skyblue-pool-demos.pages.dev (change PROJECT below
# to pick another name). The real site can deploy the same way from main later.
name: Demos to Cloudflare

on:
  push:
    branches: [claude/demo-themes-j28sca]
  workflow_dispatch:

env:
  PROJECT: skyblue-pool-demos

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the demo previews
        run: |
          python3 _build/build.py --demos
          python3 _build/pages.py

      - name: Check for the Cloudflare secrets
        id: cf
        run: echo "ready=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"

      - name: Create the Pages project (first run only)
        if: steps.cf.outputs.ready == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.PROJECT }} --production-branch main

      - name: Deploy demo-host/ to Cloudflare Pages
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy demo-host --project-name ${{ env.PROJECT }} --branch main --commit-dirty=true
